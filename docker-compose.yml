version: '3.8'

services:
  canvasflow:
    build: .
    container_name: canvasflow
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - UPLOAD_DIR=./uploads
    # Volumes are optional for local evaluation. 
    # Uncomment below to persist images and database across container restarts.
